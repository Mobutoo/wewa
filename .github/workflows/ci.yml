name: Viva Wewa checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  playable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check committed motorcycle source proofs
        run: |
          python -m unittest discover -s tools -p test_manifest_paths.py
          python tools/check_motorcycle18_index_v3.py --ref "$GITHUB_SHA" --output WEWA_Developpement_Web/validation/motorcycle-source-ci.json
          python tools/check_motorcycle_exterior_v5.py
          python tools/test_handlebar_registration_v2.py
          python tools/check_handlebar_registration_delivery_v2.py
          python tools/check_under_tank_delivery_v1.py
          python tools/check_art015_delivery_v2.py
          python tools/check_assembly_alignment_delivery_v1.py
          node tools/check_assembly_alignment_export_v1.mjs
          python tools/check_visual_proportions_delivery_v2.py
          node tools/check_visual_proportions_export_v2.mjs
          python tools/check_under_tank_layout_delivery_v3.py
          node tools/check_under_tank_layout_export_v3.mjs
          node tools/check_under_tank_completion_v1.mjs
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viva-wewa-browser-evidence
          path: |
            WEWA_Developpement_Web/validation/browser
            WEWA_Developpement_Web/validation/motorcycle-source-ci.json
